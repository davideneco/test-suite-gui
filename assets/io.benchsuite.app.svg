<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1b1e"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="55%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>

  <!-- Fond tuile sombre arrondie -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)" stroke="#2e2e34" stroke-width="3"/>
  <rect x="11" y="11" width="106" height="106" rx="22" fill="none" stroke="#ff6600" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Piste de la jauge (demi-cercle supérieur) -->
  <path d="M 28 74 A 38 38 0 1 1 100 74" fill="none" stroke="#2a2a30" stroke-width="10" stroke-linecap="round"/>

  <!-- Arc actif de charge (orange -> or) -->
  <path d="M 28 74 A 38 38 0 1 1 97 52" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>

  <!-- Graduations fines -->
  <g stroke="#52525b" stroke-width="2" stroke-linecap="round">
    <line x1="34" y1="68" x2="39" y2="66"/>
    <line x1="42" y1="44" x2="46" y2="48"/>
    <line x1="64" y1="33" x2="64" y2="39"/>
    <line x1="86" y1="44" x2="82" y2="48"/>
    <line x1="94" y1="68" x2="89" y2="66"/>
  </g>

  <!-- Aiguille pointant en pleine charge -->
  <line x1="64" y1="70" x2="88" y2="47" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="70" r="7" fill="#ff6600" stroke="#f8fafc" stroke-width="2.5"/>

  <!-- Barres de benchmark / télémétrie en bas -->
  <rect x="30" y="96" width="12" height="12" rx="3" fill="url(#bar)" opacity="0.72"/>
  <rect x="48" y="90" width="12" height="18" rx="3" fill="url(#bar)" opacity="0.86"/>
  <rect x="66" y="84" width="12" height="24" rx="3" fill="url(#bar)"/>
  <rect x="84" y="78" width="12" height="30" rx="3" fill="url(#accent)"/>
</svg>
